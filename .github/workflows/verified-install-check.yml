name: Verified install check

# Runs the README's "Verified install" commands verbatim, as an ordinary non-root user
# with a fresh home, in clean distro containers. Then it builds and runs a GUI app
# under a private Xvfb, as a new user would. It proves the documented path, not a
# privileged shortcut.

on:
  # Any change to the README (where the steps and the pinned digest live) or to this
  # check reruns it, so the documented install can't silently rot.
  pull_request:
    paths: [README.md, .github/workflows/verified-install-check.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:13", runner: ubuntu-latest }
          - { image: "ubuntu:24.04", runner: ubuntu-latest }
          - { image: "ubuntu:26.04", runner: ubuntu-latest }
          # The README's arm64 targets.
          - { image: "debian:13", runner: ubuntu-24.04-arm }
          - { image: "ubuntu:24.04", runner: ubuntu-24.04-arm }
    name: verified-install (${{ matrix.image }}, ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: "What a new user has: curl and CA certificates (the bootstrap's only stated needs)"
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl >/dev/null
          useradd -m -s /bin/bash newuser
          awk '/^### Verified install/{f=1} f&&/^```sh$/{c=1;next} c&&/^```$/{exit} c' README.md > /home/newuser/readme-steps.sh
          test -s /home/newuser/readme-steps.sh
          chown newuser /home/newuser/readme-steps.sh
          echo "README steps:"; cat /home/newuser/readme-steps.sh

      - name: README steps, verbatim, as the non-root user
        run: |
          su - newuser -c 'sh -x ./readme-steps.sh' 2>&1 | tee /tmp/readme-steps.log
          grep -q "gnustep-bootstrap.sh: OK" /tmp/readme-steps.log
          grep -q "managed installation completed" /tmp/readme-steps.log

      - name: Install the host packages setup listed (the README says the user runs this)
        run: |
          cmd=$(sed -n 's/^setup: to install GNUstep host prerequisites, run: //p' /tmp/readme-steps.log | tail -1)
          if [ -n "$cmd" ]; then echo "+ $cmd"; sh -c "$cmd" >/tmp/prereqs.log 2>&1 || { tail -40 /tmp/prereqs.log; exit 1; }; else echo "setup listed no host packages"; fi
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth procps >/dev/null

      - name: New GUI app, build and run under a private Xvfb, as the non-root user
        run: |
          path_line=$(grep -A1 '^next: Run this in the current shell:' /tmp/readme-steps.log | tail -1 | sed 's/^ *//')
          echo "PATH line from setup: $path_line"
          cat > /home/newuser/gui-check.sh <<EOF
          set -eu
          $path_line
          gnustep --version
          gnustep new gui-app Probe
          cd Probe
          gnustep build
          # gnustep run launches GUI apps detached (through openapp) and returns, so use a
          # private X server that outlives it, then check the app is still running.
          Xvfb :77 -nolisten tcp > xvfb.log 2>&1 &
          xvfb=\$!
          sleep 2
          export DISPLAY=:77
          gnustep run > run.log 2>&1
          cat run.log
          sleep 10
          if pgrep -u newuser -x Probe > /dev/null; then
            echo "gui app is running 10 s after gnustep run"
            pkill -u newuser -x Probe || true
            kill \$xvfb || true
          else
            echo "the app is not running 10 s after gnustep run"; kill \$xvfb || true; exit 1
          fi
          EOF
          chown newuser /home/newuser/gui-check.sh
          su - newuser -c 'bash ./gui-check.sh'

      - name: Nothing outside the user's install root and home
        run: |
          test ! -e /opt/gnustep-cli
          test -d /home/newuser/.local/share/gnustep-cli/bin
          ls -la /home/newuser/.local/share/gnustep-cli | head -20

  verified-install-windows:
    name: verified-install (windows, amd64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: README PowerShell steps, verbatim, as the runner's user
        shell: powershell
        run: |
          $readme = Get-Content README.md
          $start = ($readme | Select-String -Pattern '^### Verified install' | Select-Object -First 1).LineNumber
          $in = $false; $steps = @()
          foreach ($line in $readme[$start..($readme.Count - 1)]) {
            if (-not $in -and $line -eq '```powershell') { $in = $true; continue }
            if ($in -and $line -eq '```') { break }
            if ($in) { $steps += $line }
          }
          if ($steps.Count -eq 0) { throw 'no PowerShell block in the Verified install section' }
          $work = Join-Path $env:RUNNER_TEMP 'verified-install'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Content -Path (Join-Path $work 'readme-steps.ps1') -Value $steps -Encoding ascii
          Write-Output 'README steps:'; $steps
          Set-Location $work
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\readme-steps.ps1 *>&1 | Tee-Object -FilePath readme-steps.log
          $log = Get-Content readme-steps.log -Raw
          if ($log -notmatch 'managed installation completed') { throw 'setup did not complete' }
          $lines = Get-Content readme-steps.log
          $i = [array]::IndexOf($lines, ($lines | Where-Object { $_ -eq 'next: Run this in the current shell:' } | Select-Object -First 1))
          if ($i -lt 0) { throw 'setup printed no PATH line' }
          $pathLine = $lines[$i + 1].Trim()
          Write-Output "PATH line from setup: $pathLine"
          Set-Content -Path (Join-Path $work 'path-line.ps1') -Value $pathLine -Encoding ascii

      - name: New CLI tool, build and run with the installed gnustep
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'verified-install'
          Set-Location $work
          . .\path-line.ps1
          gnustep --version
          gnustep new cli-tool Probe
          if ($LASTEXITCODE -ne 0) { throw "gnustep new failed ($LASTEXITCODE)" }
          Set-Location Probe
          gnustep build
          if ($LASTEXITCODE -ne 0) { throw "gnustep build failed ($LASTEXITCODE)" }
          $out = gnustep run 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Hello from CLI tool') { throw 'the CLI tool did not run' }
          if (-not (Test-Path "$env:LOCALAPPDATA\gnustep-cli\bin")) { throw 'not installed under %LOCALAPPDATA%\gnustep-cli' }

