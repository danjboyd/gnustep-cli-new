name: Package App Artifact

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: Package id from packages/<id>/package.json
        required: true
        type: string
      target:
        description: Target id such as linux-amd64-clang or linux-arm64-clang
        required: true
        type: string
      version:
        description: Optional package artifact version override
        required: false
        type: string
      toolchain_url:
        description: URL for the managed toolchain archive to build against
        required: false
        type: string
      toolchain_sha256:
        description: Expected SHA256 of the managed toolchain archive
        required: false
        type: string
      toolchain_artifact_run_id:
        description: Workflow run id that uploaded a managed toolchain artifact
        required: false
        type: string
      toolchain_artifact_name:
        description: Workflow artifact name containing gnustep-toolchain-*.tar.gz
        required: false
        type: string
      runner_label:
        description: GitHub runner label for the target host
        required: false
        default: ubuntu-latest
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  package-app-artifact:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download managed toolchain from workflow artifact
        if: ${{ inputs.toolchain_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.toolchain_artifact_name }}
          path: ${{ runner.temp }}/package-app-toolchain/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.toolchain_artifact_run_id }}

      - name: Download managed toolchain from URL
        if: ${{ inputs.toolchain_artifact_run_id == '' }}
        run: |
          if [ -z "${{ inputs.toolchain_url }}" ] || [ -z "${{ inputs.toolchain_sha256 }}" ]; then
            echo "toolchain_url and toolchain_sha256 are required when toolchain_artifact_run_id is not supplied" >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/package-app-toolchain"
          curl -fsSL "${{ inputs.toolchain_url }}" -o "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz"
          printf '%s  %s\n' "${{ inputs.toolchain_sha256 }}" "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz" | sha256sum -c -

      - name: Extract managed toolchain
        run: |
          if [ -n "${{ inputs.toolchain_artifact_run_id }}" ]; then
            toolchain_archive="$(find "$RUNNER_TEMP/package-app-toolchain/artifact" -maxdepth 1 -type f -name 'gnustep-toolchain-*.tar.gz' | head -1)"
            if [ -z "$toolchain_archive" ]; then
              echo "Downloaded workflow artifact did not contain gnustep-toolchain-*.tar.gz" >&2
              exit 3
            fi
            cp "$toolchain_archive" "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz"
          fi
          mkdir -p "$RUNNER_TEMP/package-app-toolchain/root"
          tar -xzf "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz" -C "$RUNNER_TEMP/package-app-toolchain/root"

      - name: Relocate managed toolchain
        run: |
          root="$RUNNER_TEMP/package-app-toolchain/root"
          placeholder="__GNUSTEP_CLI_INSTALL_ROOT__"
          escaped_root="$(printf '%s' "$root" | sed 's/[\&|]/\\&/g')"
          find "$root" -type f 2>/dev/null | while IFS= read -r file; do
            if LC_ALL=C grep -Iq "$placeholder" "$file" 2>/dev/null; then
              temp_file="$file.relocating.$$"
              sed "s|$placeholder|$escaped_root|g" "$file" >"$temp_file"
              cat "$temp_file" >"$file"
              rm -f "$temp_file"
            fi
          done

      - name: Build package artifact
        run: |
          mkdir -p "$RUNNER_TEMP/package-app-output"
          args=(--json package-managed-source-artifact
            --packages-dir packages
            --package-id "${{ inputs.package_id }}"
            --target "${{ inputs.target }}"
            --output-dir "$RUNNER_TEMP/package-app-output"
            --toolchain-root "$RUNNER_TEMP/package-app-toolchain/root")
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          python3 scripts/internal/build_infra.py "${args[@]}" | tee "$RUNNER_TEMP/package-app-output/package-build-report.json"
          python3 -c 'import json,sys; payload=json.load(open(sys.argv[1])); raise SystemExit(0 if payload.get("ok") else 1)' "$RUNNER_TEMP/package-app-output/package-build-report.json"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-package-app-${{ inputs.package_id }}-${{ inputs.target }}
          path: |
            ${{ runner.temp }}/package-app-output/*.tar.gz
            ${{ runner.temp }}/package-app-output/*.zip
            ${{ runner.temp }}/package-app-output/package-build-report.json
