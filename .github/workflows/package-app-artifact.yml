name: Package App Artifact

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: Package id from packages/<id>/package.json
        required: true
        type: string
      target:
        description: Target id such as linux-amd64-clang or linux-arm64-clang
        required: true
        type: string
      version:
        description: Optional package artifact version override
        required: false
        type: string
      toolchain_url:
        description: URL for the managed toolchain archive to build against
        required: false
        type: string
      toolchain_sha256:
        description: Expected SHA256 of the managed toolchain archive
        required: false
        type: string
      toolchain_artifact_run_id:
        description: Workflow run id that uploaded a managed toolchain artifact
        required: false
        type: string
      toolchain_artifact_name:
        description: Workflow artifact name containing gnustep-toolchain-*.tar.gz
        required: false
        type: string
      runner_label:
        description: GitHub runner label for the target host
        required: false
        default: ubuntu-latest
        type: string
      qualify_image:
        description: "Linux, optional: clean target distro image (e.g. debian:13) to install, smoke and remove the built artifact in, through the published bootstrap"
        required: false
        default: ""
        type: string
      qualify_cli_run_id:
        description: "Optional: Linux Managed Artifacts run whose CLI tarball replaces the published CLI during qualification"
        required: false
        default: ""
        type: string
      qualify_release_tag:
        description: Release whose bootstrap sets up the qualification root
        required: false
        default: v0.1.3
        type: string
      qualify_bootstrap_sha256:
        description: Expected sha256 of that release's gnustep-bootstrap.sh
        required: false
        default: 26ac6763fcc9dd6a86bf1d43dba140c45b84737ecb4fa3c1d1ef43d9fa437406
        type: string
      build_image_target:
        description: "Linux: managed toolchain target whose pinned base image (toolchains/<id>/Dockerfile) runs the build, e.g. linux-amd64-clang. Empty builds on the runner OS."
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  package-app-artifact:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download managed toolchain from workflow artifact
        if: ${{ inputs.toolchain_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.toolchain_artifact_name }}
          path: ${{ runner.temp }}/package-app-toolchain/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.toolchain_artifact_run_id }}

      - name: Download managed toolchain from URL
        if: ${{ inputs.toolchain_artifact_run_id == '' }}
        run: |
          if [ -z "${{ inputs.toolchain_url }}" ] || [ -z "${{ inputs.toolchain_sha256 }}" ]; then
            echo "toolchain_url and toolchain_sha256 are required when toolchain_artifact_run_id is not supplied" >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/package-app-toolchain"
          curl -fsSL "${{ inputs.toolchain_url }}" -o "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz"
          printf '%s  %s\n' "${{ inputs.toolchain_sha256 }}" "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz" | sha256sum -c -

      - name: Extract managed toolchain
        run: |
          if [ -n "${{ inputs.toolchain_artifact_run_id }}" ]; then
            toolchain_archive="$(find "$RUNNER_TEMP/package-app-toolchain/artifact" -maxdepth 1 -type f -name 'gnustep-toolchain-*.tar.gz' | head -1)"
            if [ -z "$toolchain_archive" ]; then
              echo "Downloaded workflow artifact did not contain gnustep-toolchain-*.tar.gz" >&2
              exit 3
            fi
            cp "$toolchain_archive" "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz"
          fi
          mkdir -p "$RUNNER_TEMP/package-app-toolchain/root"
          tar -xzf "$RUNNER_TEMP/package-app-toolchain/toolchain.tar.gz" -C "$RUNNER_TEMP/package-app-toolchain/root"

      - name: Relocate managed toolchain
        run: |
          root="$RUNNER_TEMP/package-app-toolchain/root"
          placeholder="__GNUSTEP_CLI_INSTALL_ROOT__"
          escaped_root="$(printf '%s' "$root" | sed 's/[\&|]/\\&/g')"
          find "$root" -type f 2>/dev/null | while IFS= read -r file; do
            if LC_ALL=C grep -Iq "$placeholder" "$file" 2>/dev/null; then
              temp_file="$file.relocating.$$"
              sed "s|$placeholder|$escaped_root|g" "$file" >"$temp_file"
              cat "$temp_file" >"$file"
              rm -f "$temp_file"
            fi
          done

      # A managed Linux toolchain links its base image's glibc/ICU SONAMEs (Debian 13:
      # ICU 76), not the runner OS's (ubuntu-24.04: ICU 74), so the package must be
      # built in that same image. The workspace and RUNNER_TEMP are mounted at their
      # host paths, so the relocated toolchain root stays valid inside the container.
      - name: Build pinned base image
        if: ${{ inputs.build_image_target != '' }}
        run: |
          set -eu
          test -f "toolchains/${{ inputs.build_image_target }}/Dockerfile"
          docker build -t "gnustep-package-app-${{ inputs.build_image_target }}" "toolchains/${{ inputs.build_image_target }}"

      - name: Build package artifact
        env:
          BUILD_IMAGE: ${{ inputs.build_image_target != '' && format('gnustep-package-app-{0}', inputs.build_image_target) || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/package-app-output"
          if [ -n "$BUILD_IMAGE" ]; then
            run_build() {
              docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
                -w "$GITHUB_WORKSPACE" -e HOME="$RUNNER_TEMP/package-app-home" \
                --user "$(id -u):$(id -g)" "$BUILD_IMAGE" python3 "$@"
            }
            mkdir -p "$RUNNER_TEMP/package-app-home"
          else
            run_build() { python3 "$@"; }
          fi
          args=(--json package-managed-source-artifact
            --packages-dir packages
            --package-id "${{ inputs.package_id }}"
            --target "${{ inputs.target }}"
            --output-dir "$RUNNER_TEMP/package-app-output"
            --toolchain-root "$RUNNER_TEMP/package-app-toolchain/root")
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          run_build scripts/internal/build_infra.py "${args[@]}" | tee "$RUNNER_TEMP/package-app-output/package-build-report.json"
          python3 -c 'import json,sys; payload=json.load(open(sys.argv[1])); raise SystemExit(0 if payload.get("ok") else 1)' "$RUNNER_TEMP/package-app-output/package-build-report.json"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-package-app-${{ inputs.package_id }}-${{ inputs.target }}
          path: |
            ${{ runner.temp }}/package-app-output/*.tar.gz
            ${{ runner.temp }}/package-app-output/*.zip
            ${{ runner.temp }}/package-app-output/package-build-report.json

      - name: Qualify install and remove in target distro container
        if: ${{ inputs.qualify_image != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          in="$RUNNER_TEMP/qualify-in"
          mkdir -p "$in" "$RUNNER_TEMP/qualify-out"
          gh release download "${{ inputs.qualify_release_tag }}" --repo "$GITHUB_REPOSITORY" --dir "$in" --pattern gnustep-bootstrap.sh
          echo "${{ inputs.qualify_bootstrap_sha256 }}  $in/gnustep-bootstrap.sh" | sha256sum -c -
          artifact=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact"]["path"])' "$RUNNER_TEMP/package-app-output/package-build-report.json")
          cp "$artifact" "$in/"
          cli_arg=""
          if [ -n "${{ inputs.qualify_cli_run_id }}" ]; then
            gh run download "${{ inputs.qualify_cli_run_id }}" --repo "$GITHUB_REPOSITORY" --dir "$in/cli-run" --pattern 'gnustep-linux-managed-*'
            cli=$(find "$in/cli-run" -type f -name 'gnustep-cli-*.tar.gz' | head -n 1)
            test -n "$cli"
            cli_arg="/in/${cli#"$in/"}"
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$in:/in:ro" -v "$RUNNER_TEMP/qualify-out:/out" \
            "${{ inputs.qualify_image }}" \
            sh /src/scripts/dev/package-install-qualification.sh \
              "${{ inputs.package_id }}" "${{ inputs.target }}" "/in/$(basename "$artifact")" /in/gnustep-bootstrap.sh /out $cli_arg

      - name: Upload qualification evidence
        if: ${{ always() && inputs.qualify_image != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-package-install-qualification-${{ inputs.package_id }}-${{ inputs.target }}
          path: ${{ runner.temp }}/qualify-out
