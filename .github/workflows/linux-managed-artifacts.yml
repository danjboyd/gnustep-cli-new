name: Linux Managed Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Managed Linux target id
        required: true
        default: linux-arm64-clang
        type: choice
        options:
          - linux-amd64-clang
          - linux-arm64-clang
          - linux-ubuntu2404-amd64-clang
          - linux-ubuntu2604-amd64-clang
      version:
        description: Artifact version label
        required: true
        default: 0.1.0-dev-current
        type: string
      runner_label:
        description: Runner label for the target architecture
        required: true
        default: ubuntu-24.04-arm
        type: string
      reuse_toolchain_tag:
        description: "Optional: build only the CLI, against this release tag's published toolchain asset for the target (for example v0.1.0); the toolchain bytes are kept unchanged"
        required: false
        default: ""
        type: string
      qualify_image:
        description: "Optional: container image of the target distro release (for example ubuntu:26.04) to qualify the built artifacts in"
        required: false
        default: ""
        type: string
      qualify_icu_major:
        description: Expected ICU major version for qualification (required with qualify_image)
        required: false
        default: ""
        type: string
      qualify_bootstrap_url:
        description: "Optional: qualify the PUBLISHED release instead of this run's artifacts by installing through this bootstrap URL"
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  linux-managed-artifacts:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce target architecture
        run: |
          case "${{ inputs.target }}" in
            linux-arm64-clang)
              test "$(uname -m)" = "aarch64"
              ;;
            linux-amd64-clang|linux-ubuntu2404-amd64-clang|linux-ubuntu2604-amd64-clang)
              test "$(uname -m)" = "x86_64"
              ;;
            *)
              echo "Unsupported target: ${{ inputs.target }}" >&2
              exit 2
              ;;
          esac

      # The toolchain and CLI must be compiled inside the target's pinned base
      # image so the artifact links the base image's glibc/ICU SONAMEs rather than
      # the GitHub runner OS's (ubuntu-24.04 = ICU 74, which loads on neither
      # Debian 12 nor Debian 13). Each toolchains/<target>/Dockerfile pins the
      # correct base: debian:13 for the Debian targets, ubuntu:24.04 for ubuntu2404,
      # ubuntu:26.04 for ubuntu2604.
      - name: Stage build environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          out="$RUNNER_TEMP/gnustep-linux-managed-artifacts"
          mkdir -p "$out"
          case "${{ inputs.target }}" in
            linux-arm64-clang) staging_prefix=/tmp/gnustep-cli-linux-arm64-toolchain/install ;;
            linux-amd64-clang) staging_prefix=/tmp/gnustep-cli-linux-toolchain/install ;;
            linux-ubuntu2404-amd64-clang) staging_prefix=/tmp/gnustep-cli-ubuntu2404-toolchain/install ;;
            linux-ubuntu2604-amd64-clang) staging_prefix=/tmp/gnustep-cli-ubuntu2604-toolchain/install ;;
          esac
          echo "STAGING_PREFIX=$staging_prefix" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.reuse_toolchain_tag }}" ]; then
            gh release download "${{ inputs.reuse_toolchain_tag }}" \
              --repo "${{ github.repository }}" \
              --dir "$out" \
              --pattern "gnustep-toolchain-${{ inputs.target }}-${{ inputs.version }}.tar.gz"
          fi
          cat > "$out/container-build.sh" <<'CONTAINER_BUILD'
          set -eu
          git config --global --add safe.directory /src
          cd /src
          toolchain_archive="/out/gnustep-toolchain-$TARGET-$VERSION.tar.gz"
          if [ -f "$toolchain_archive" ]; then
            echo "Reusing published toolchain $toolchain_archive; building the CLI only."
          else
            bash "toolchains/$TARGET/build-toolchain.sh"
            python3 scripts/internal/build_infra.py --json package-source-built-linux-toolchain \
              --staging-prefix "$STAGING_PREFIX" \
              --output-dir /out/toolchain-root \
              --toolchain-version "$VERSION" \
              --target "$TARGET" | tee /out/toolchain-package-report.json
            python3 -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1]))["ok"] else 1)' /out/toolchain-package-report.json
            tar -C /out/toolchain-root -czf "$toolchain_archive" .
          fi
          python3 scripts/internal/build_infra.py --json build-linux-cli-against-managed-toolchain \
            --toolchain-archive "$toolchain_archive" \
            --output-archive "/out/gnustep-cli-$TARGET-$VERSION.tar.gz" \
            --version "$VERSION" \
            --target "$TARGET" \
            --repo-root /src | tee /out/cli-build-report.json
          python3 -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1]))["ok"] else 1)' /out/cli-build-report.json
          CONTAINER_BUILD

      - name: Build managed toolchain and CLI in pinned base image
        run: |
          set -eu
          out="$RUNNER_TEMP/gnustep-linux-managed-artifacts"
          image="gnustep-managed-build-${{ inputs.target }}"
          docker build -t "$image" "toolchains/${{ inputs.target }}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$out:/out" \
            -e TARGET="${{ inputs.target }}" \
            -e VERSION="${{ inputs.version }}" \
            -e STAGING_PREFIX="$STAGING_PREFIX" \
            "$image" \
            bash /out/container-build.sh
          # Artifacts are written by the container's root user; hand them back to
          # the runner user so later steps and upload-artifact can read them.
          sudo chown -R "$(id -u):$(id -g)" "$out"

      - name: Write checksums
        run: |
          cd "$RUNNER_TEMP/gnustep-linux-managed-artifacts"
          sha256sum gnustep-toolchain-*.tar.gz gnustep-cli-*.tar.gz > SHA256SUMS

      - name: Upload Linux managed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-linux-managed-${{ inputs.target }}-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/gnustep-toolchain-*.tar.gz
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/gnustep-cli-*.tar.gz
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/SHA256SUMS
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/*-report.json

      # Optional container qualification: bundled SONAME check, bootstrap setup
      # as an unprivileged user, version/help/doctor, new/build/run, and a
      # Foundation compile-link-run probe inside a clean container of the target
      # distro release. Real distro userland on the runner kernel, not a
      # VM-backed host claim.
      - name: Qualify artifacts in target distro container
        if: ${{ inputs.qualify_image != '' }}
        run: |
          set -eu
          test -n "${{ inputs.qualify_icu_major }}"
          mkdir -p "$RUNNER_TEMP/qualification"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/gnustep-linux-managed-artifacts:/artifacts" \
            -v "$RUNNER_TEMP/qualification:/out" \
            -e QUALIFY_BOOTSTRAP_URL="${{ inputs.qualify_bootstrap_url }}" \
            "${{ inputs.qualify_image }}" \
            sh /src/scripts/dev/linux-container-qualification.sh \
              "${{ inputs.target }}" /artifacts "${{ inputs.version }}" "${{ inputs.qualify_icu_major }}" /out

      - name: Upload qualification evidence
        if: ${{ always() && inputs.qualify_image != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-container-qualification-${{ inputs.target }}-${{ inputs.version }}${{ inputs.qualify_bootstrap_url != '' && '-published' || '' }}
          path: ${{ runner.temp }}/qualification
