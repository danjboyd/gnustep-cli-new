name: Linux Managed Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Managed Linux target id
        required: true
        default: linux-arm64-clang
        type: choice
        options:
          - linux-amd64-clang
          - linux-arm64-clang
          - linux-ubuntu2404-amd64-clang
      version:
        description: Artifact version label
        required: true
        default: 0.1.0-dev-current
        type: string
      runner_label:
        description: Runner label for the target architecture
        required: true
        default: ubuntu-24.04-arm
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  linux-managed-artifacts:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            ca-certificates \
            clang \
            cmake \
            curl \
            git \
            libavahi-client-dev \
            libblocksruntime-dev \
            libcurl4-openssl-dev \
            libffi-dev \
            libgnutls28-dev \
            libicu-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff-dev \
            libxml2-dev \
            libxslt1-dev \
            lld \
            make \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            zlib1g-dev

      - name: Enforce target architecture
        run: |
          case "${{ inputs.target }}" in
            linux-arm64-clang)
              test "$(uname -m)" = "aarch64"
              ;;
            linux-amd64-clang|linux-ubuntu2404-amd64-clang)
              test "$(uname -m)" = "x86_64"
              ;;
            *)
              echo "Unsupported target: ${{ inputs.target }}" >&2
              exit 2
              ;;
          esac

      - name: Build source-managed toolchain
        run: |
          "toolchains/${{ inputs.target }}/build-toolchain.sh"

      - name: Package managed toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/gnustep-linux-managed-artifacts"
          case "${{ inputs.target }}" in
            linux-arm64-clang)
              staging_prefix=/tmp/gnustep-cli-linux-arm64-toolchain/install
              ;;
            linux-amd64-clang)
              staging_prefix=/tmp/gnustep-cli-linux-toolchain/install
              ;;
            linux-ubuntu2404-amd64-clang)
              staging_prefix=/tmp/gnustep-cli-ubuntu2404-toolchain/install
              ;;
          esac
          packaged_root="$RUNNER_TEMP/gnustep-linux-managed-artifacts/toolchain-root"
          python3 scripts/internal/build_infra.py --json package-source-built-linux-toolchain \
            --staging-prefix "$staging_prefix" \
            --output-dir "$packaged_root" \
            --toolchain-version "${{ inputs.version }}" \
            --target "${{ inputs.target }}" | tee "$RUNNER_TEMP/gnustep-linux-managed-artifacts/toolchain-package-report.json"
          python3 -c 'import json,sys; payload=json.load(open(sys.argv[1])); raise SystemExit(0 if payload.get("ok") else 1)' "$RUNNER_TEMP/gnustep-linux-managed-artifacts/toolchain-package-report.json"
          toolchain_archive="$RUNNER_TEMP/gnustep-linux-managed-artifacts/gnustep-toolchain-${{ inputs.target }}-${{ inputs.version }}.tar.gz"
          tar -C "$packaged_root" -czf "$toolchain_archive" .
          echo "TOOLCHAIN_ARCHIVE=$toolchain_archive" >> "$GITHUB_ENV"

      - name: Build full CLI against managed toolchain
        run: |
          cli_archive="$RUNNER_TEMP/gnustep-linux-managed-artifacts/gnustep-cli-${{ inputs.target }}-${{ inputs.version }}.tar.gz"
          python3 scripts/internal/build_infra.py --json build-linux-cli-against-managed-toolchain \
            --toolchain-archive "$TOOLCHAIN_ARCHIVE" \
            --output-archive "$cli_archive" \
            --version "${{ inputs.version }}" \
            --target "${{ inputs.target }}" \
            --repo-root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/gnustep-linux-managed-artifacts/cli-build-report.json"
          python3 -c 'import json,sys; payload=json.load(open(sys.argv[1])); raise SystemExit(0 if payload.get("ok") else 1)' "$RUNNER_TEMP/gnustep-linux-managed-artifacts/cli-build-report.json"

      - name: Write checksums
        run: |
          cd "$RUNNER_TEMP/gnustep-linux-managed-artifacts"
          sha256sum gnustep-toolchain-*.tar.gz gnustep-cli-*.tar.gz > SHA256SUMS

      - name: Upload Linux managed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-linux-managed-${{ inputs.target }}-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/gnustep-toolchain-*.tar.gz
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/gnustep-cli-*.tar.gz
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/SHA256SUMS
            ${{ runner.temp }}/gnustep-linux-managed-artifacts/*-report.json
