name: Windows gnustep-base Variants

# Diagnostic (temporary): builds gnustep-base three ways in the same locked root and
# runs diagnose-nsurl.sh against each, to tell a TLS-patch regression from a
# rebuild difference. msys2 = MSYS2's own 1.31.1-10 binary; control = our recipe
# without the TLS patches; tls = our recipe with them.

on:
  workflow_dispatch:
  push:
    branches: [libs-base-tls-backport]
    paths:
      - .github/workflows/windows-gnustep-base-variants.yml
      - toolchains/windows-amd64-msys2-clang64/diagnose-nsurl.sh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  variant:
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [msys2, control, tls]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble the locked MSYS2 root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File toolchains\windows-amd64-msys2-clang64\assemble-toolchain.ps1 -Prefix "$env:RUNNER_TEMP\toolchain" -CacheDir "$env:RUNNER_TEMP\cache" -MsysRoot "$env:RUNNER_TEMP\msys-root"
          if ($LASTEXITCODE -ne 0) { throw "assemble failed: $LASTEXITCODE" }
      - name: Put the variant's gnustep-base in place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bash = "$env:RUNNER_TEMP\msys-root\usr\bin\bash.exe"
          $env:MSYSTEM = 'CLANG64'
          $env:CHERE_INVOKING = '1'
          $package = "$env:GITHUB_WORKSPACE\toolchains\windows-amd64-msys2-clang64\gnustep-base-package"
          $unix = (& $bash -lc "cygpath -u '$package'").Trim()
          if ('${{ matrix.variant }}' -eq 'msys2') {
            & $bash -lc "cd /tmp && curl -fsSLO https://repo.msys2.org/mingw/clang64/mingw-w64-clang-x86_64-gnustep-base-1.31.1-10-any.pkg.tar.zst && echo 'b97c4f0ca49bd4f768d1281762a7a52995f2e9d9b761d63654f090423d25c540  mingw-w64-clang-x86_64-gnustep-base-1.31.1-10-any.pkg.tar.zst' | sha256sum -c - && pacman -U --noconfirm --overwrite '*' mingw-w64-clang-x86_64-gnustep-base-1.31.1-10-any.pkg.tar.zst"
            if ($LASTEXITCODE -ne 0) { throw "install failed: $LASTEXITCODE" }
          } else {
            Copy-Item "$env:GITHUB_WORKSPACE\toolchains\patches\libs-base\000[1-6]*.patch" $package
            if ('${{ matrix.variant }}' -eq 'control') {
              # Same recipe with the TLS patch step turned into a no-op.
              & $bash -lc "bash `"`$(cygpath -u '$env:GITHUB_WORKSPACE')/scripts/dev/pkgbuild-without-tls-patches.sh`" '$unix/PKGBUILD'"
              if ($LASTEXITCODE -ne 0) { throw "control edit failed" }
            }
            & $bash -lc "pacman -Sy --noconfirm && pacman -S --noconfirm --needed base-devel patchutils rsync mingw-w64-clang-x86_64-autotools >/dev/null"
            & $bash -lc "sed -i -e 's|^typedef int mode_t;|/* mode_t is provided by MinGW sys/types.h in this managed toolchain. */|' -e 's|^typedef void pthread_attr_t;|#if !defined(__MINGW32__) /* winpthreads defines pthread_attr_t */\ntypedef void pthread_attr_t;\n#endif|' /clang64/include/os/generic_win_base.h"
            & $bash -lc "cd '$unix' && MINGW_ARCH=clang64 makepkg-mingw --noconfirm --skippgpcheck --nodeps -f > /tmp/makepkg.log 2>&1; echo makepkg=`$?; grep -c 'patching file' /tmp/makepkg.log; tail -3 /tmp/makepkg.log"
            & $bash -lc "cd '$unix' && pacman -U --noconfirm --overwrite '*' mingw-w64-clang-x86_64-gnustep-base-*.pkg.tar.zst"
            if ($LASTEXITCODE -ne 0) { throw "install failed: $LASTEXITCODE" }
          }
          & $bash -lc "pacman -Q mingw-w64-clang-x86_64-gnustep-base clang; echo tls-strings=`$(strings /clang64/bin/gnustep-base-1_31.dll | grep -c GSTLSVerifyFailedNotification)"
          exit 0
      - name: Diagnose NSURLConnection
        shell: pwsh
        run: |
          $bash = "$env:RUNNER_TEMP\msys-root\usr\bin\bash.exe"
          $env:MSYSTEM = 'CLANG64'
          $env:CHERE_INVOKING = '1'
          & $bash -lc "pacman -S --noconfirm --needed mingw-w64-clang-x86_64-gdb >/dev/null 2>&1 || pacman -Sy --noconfirm mingw-w64-clang-x86_64-gdb >/dev/null; which gdb"
          $env:DIAG_GDB = '1'
          & $bash -lc "bash `"`$(cygpath -u '$env:GITHUB_WORKSPACE')/toolchains/windows-amd64-msys2-clang64/diagnose-nsurl.sh`" /"
