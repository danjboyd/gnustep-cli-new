name: Publish MSYS2 Inputs (2026-11-06)

# One-shot: publishes the patched MSYS2 gnustep-base package built by run
# 42257083471 (branch windows-tls-ca-bundle, 31328fc) as an immutable pre-release
# asset, so the Windows toolchain lock can pin it by URL and sha256.
# 1.31.1-10.4 adds to 10.3 our Windows-only 0009 (also trust the bundled authorities)
# and replaces the bundled authorities with the locked Mozilla set.
# It refuses if the tag already exists or the package's digest differs.

on:
  push:
    branches: [publish-msys2-inputs-2026-11-06]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAG: msys2-inputs-2026-11-06
  SOURCE_RUN: "42257083471"
  SOURCE_SHA: 31328fcce94dad183ddc74e5b311964d7e677c7e
  PACKAGE: mingw-w64-clang-x86_64-gnustep-base-1.31.1-10.4-any.pkg.tar.zst
  PACKAGE_SHA256: 25385b215b35a2005690f539318c67b7d5c463db059d48e01755391f2bf2c377

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the package as a pre-release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing is replaced." >&2
            exit 1
          fi
          d="$RUNNER_TEMP/in"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name windows-gnustep-base-package --dir "$d"
          echo "$PACKAGE_SHA256  $d/$PACKAGE" | sha256sum -c -
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Pinned build input for the Windows MSYS2 clang64 toolchain, not a gnustep-cli release.

          \`$PACKAGE\` (sha256 \`$PACKAGE_SHA256\`): MSYS2's gnustep-base 1.31.1-10 recipe rebuilt with eight upstream libs-base TLS commits, the clang 23 workaround flag from libs-base 7c81d0c83, a Windows-only patch that also trusts the bundled authorities, and the Mozilla CA set from ca-certificates 20260816-1 as those authorities, from \`toolchains/windows-amd64-msys2-clang64/gnustep-base-package\` at $SOURCE_SHA, by workflow run $SOURCE_RUN.
          NOTES
          gh release create "$TAG" "$d/$PACKAGE" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "MSYS2 inputs 2026-11-06" --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets --jq '.isPrerelease, (.assets[]|.name+" "+.digest)'
