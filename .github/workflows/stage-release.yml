name: Stage Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0-dev-dogfood
        required: true
      channel:
        description: Release channel
        required: true
        default: dogfood
      base_url:
        description: Base URL used in release manifest artifact URLs
        required: true
        default: https://github.com/danjboyd/gnustep-cli-new/releases/download
      source_artifact_run_id:
        description: Workflow run id containing CLI/toolchain input artifacts (omit when reuse_release_tag is set)
        required: false
      reuse_release_tag:
        description: "Reuse mode: stage cli/toolchain by downloading existing assets from this release tag (e.g. v0.1.0) instead of workflow-run artifacts"
        required: false
      linux_source_artifact_run_id:
        description: Optional workflow run id containing Linux input artifacts
        required: false
      windows_source_artifact_run_id:
        description: Optional workflow run id containing Windows input artifacts
        required: false
      linux_cli_artifact:
        description: Artifact name containing the Linux CLI input archive or directory
        required: false
      linux_toolchain_artifact:
        description: Artifact name containing the Linux toolchain input archive or directory
        required: false
      windows_cli_artifact:
        description: Artifact name containing the Windows CLI input archive or directory
        required: false
      windows_toolchain_artifact:
        description: Artifact name containing the Windows toolchain input archive or directory
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stage-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve staging paths
        run: |
          echo "INPUT_ROOT=$RUNNER_TEMP/gnustep-release-inputs" >> "$GITHUB_ENV"
          echo "OUTPUT_ROOT=$RUNNER_TEMP/gnustep-release-output" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/gnustep-release-output/${{ inputs.channel }}/${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Download Linux CLI artifact
        if: ${{ inputs.linux_cli_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.linux_cli_artifact }}
          path: ${{ runner.temp }}/gnustep-release-inputs/linux-cli
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_source_artifact_run_id || inputs.source_artifact_run_id }}

      - name: Download Linux toolchain artifact
        if: ${{ inputs.linux_toolchain_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.linux_toolchain_artifact }}
          path: ${{ runner.temp }}/gnustep-release-inputs/linux-toolchain
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_source_artifact_run_id || inputs.source_artifact_run_id }}

      - name: Download Windows CLI artifact
        if: ${{ inputs.windows_cli_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.windows_cli_artifact }}
          path: ${{ runner.temp }}/gnustep-release-inputs/windows-cli
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_source_artifact_run_id || inputs.source_artifact_run_id }}

      - name: Download Windows toolchain artifact
        if: ${{ inputs.windows_toolchain_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.windows_toolchain_artifact }}
          path: ${{ runner.temp }}/gnustep-release-inputs/windows-toolchain
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_source_artifact_run_id || inputs.source_artifact_run_id }}

      - name: Stage release directory
        if: ${{ inputs.reuse_release_tag == '' }}
        run: |
          resolve_input() {
            kind="$1"
            target="$2"
            path="$3"
            if [ -d "$path" ]; then
              match=$(find "$path" -type f \( -name "gnustep-$kind-$target-*.tar.gz" -o -name "gnustep-$kind-$target-*.zip" \) | sort | tail -n 1)
              if [ -n "$match" ]; then
                printf '%s\n' "$match"
                return 0
              fi
              count=$(find "$path" -mindepth 1 -maxdepth 1 | wc -l)
              if [ "$count" -eq 1 ]; then
                find "$path" -mindepth 1 -maxdepth 1
                return 0
              fi
            fi
            printf '%s\n' "$path"
          }
          args=(--json stage-release
            --version "${{ inputs.version }}"
            --channel "${{ inputs.channel }}"
            --base-url "${{ inputs.base_url }}"
            --output-dir "$OUTPUT_ROOT")
          if [ -n "${{ inputs.linux_cli_artifact }}" ]; then
            args+=(--cli-input "linux-amd64-clang=$(resolve_input cli linux-amd64-clang "$INPUT_ROOT/linux-cli")")
          fi
          if [ -n "${{ inputs.linux_toolchain_artifact }}" ]; then
            args+=(--toolchain-input "linux-amd64-clang=$(resolve_input toolchain linux-amd64-clang "$INPUT_ROOT/linux-toolchain")")
          fi
          if [ -n "${{ inputs.windows_cli_artifact }}" ]; then
            args+=(--cli-input "windows-amd64-msys2-clang64=$(resolve_input cli windows-amd64-msys2-clang64 "$INPUT_ROOT/windows-cli")")
          fi
          if [ -n "${{ inputs.windows_toolchain_artifact }}" ]; then
            args+=(--toolchain-input "windows-amd64-msys2-clang64=$(resolve_input toolchain windows-amd64-msys2-clang64 "$INPUT_ROOT/windows-toolchain")")
          fi
          python3 scripts/internal/build_infra.py "${args[@]}"
          marker=$(find "$INPUT_ROOT" -type f -name windows-current-source-artifact.json | sort | head -n 1)
          if [ -n "$marker" ]; then
            cp "$marker" "$RELEASE_DIR/windows-current-source-artifact.json"
          fi
          python3 scripts/internal/build_infra.py --json verify-release --release-dir "$RELEASE_DIR"

      # Reuse mode: rebuild a complete staged release by downloading the already
      # published, validated cli/toolchain assets from an existing release tag.
      # Used to add a new target (for example linux-arm64-clang) to a release
      # without rebuilding the other targets: every cli/toolchain asset present on
      # the tag is re-staged byte-for-byte, so the regenerated release-manifest
      # lists all targets and no previously published target is dropped.
      - name: Stage release directory from reused release assets
        if: ${{ inputs.reuse_release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${{ inputs.version }}"
          tag="${{ inputs.reuse_release_tag }}"
          reuse_dir="$INPUT_ROOT/reuse"
          mkdir -p "$reuse_dir"
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --dir "$reuse_dir" \
            --pattern 'gnustep-cli-*' \
            --pattern 'gnustep-toolchain-*' \
            --pattern 'windows-current-source-artifact.json'
          args=(--json stage-release
            --version "$version"
            --channel "${{ inputs.channel }}"
            --base-url "${{ inputs.base_url }}"
            --output-dir "$OUTPUT_ROOT")
          for kind in cli toolchain; do
            for f in "$reuse_dir/gnustep-$kind-"*"-$version".tar.gz "$reuse_dir/gnustep-$kind-"*"-$version".zip; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              target="${base#gnustep-$kind-}"
              target="${target%-$version.tar.gz}"
              target="${target%-$version.zip}"
              args+=("--$kind-input" "$target=$f")
            done
          done
          python3 scripts/internal/build_infra.py "${args[@]}"
          if [ -f "$reuse_dir/windows-current-source-artifact.json" ]; then
            cp "$reuse_dir/windows-current-source-artifact.json" "$RELEASE_DIR/windows-current-source-artifact.json"
          fi
          python3 scripts/internal/build_infra.py --json verify-release --release-dir "$RELEASE_DIR"

      - name: Upload staged release
        uses: actions/upload-artifact@v4
        with:
          name: gnustep-staged-release
          path: ${{ env.RELEASE_DIR }}
